# CI do próprio kit: estilo, PHPStan e testes, nas versões de PHP suportadas.
name: CI

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

jobs:
    check:
        name: ${{ matrix.os }} / PHP ${{ matrix.php }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, windows-latest]
                php: ['8.4', '8.5']
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  extensions: zip
                  tools: composer:v2

            - name: Dependências
              run: composer update --no-interaction --no-progress --prefer-dist

            - name: Git para os testes do verificador
              run: |
                  git config --global user.email ci@example.com
                  git config --global user.name CI

            - name: composer check (estilo, PHPStan, testes)
              run: composer check

            - name: Pacote de skills para Agensi
              run: composer package:agensi
